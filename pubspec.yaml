name: royal_tint
description: Multi-platform Flutter app for Royal Tint

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.1.1
  dart_firebase_admin: 0.4.1
  
  # State Management
  provider: ^6.1.5

  csv: ^6.0.0
  
  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  
  # Routing
  go_router: ^17.1.0
  
  # UI
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10
  bootstrap_icons: ^1.11.3
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1 
 
  # Media & Files
  image_picker: ^1.1.2

  # OOP / Domian Layer
  equatable: ^2.0.5  

  # Notification
  flutter_local_notifications: ^20.1.0

  # Utils
  intl: ^0.20.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/packages/
    - assets/seed/vehicles_my.csv